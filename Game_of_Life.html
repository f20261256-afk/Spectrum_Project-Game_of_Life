<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Game of Life</title>
    <style>
        body {
            background: #0a1120;
            color: #d6e4f2;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            background: #0a1120;
            border: 1px solid #1c2a3d;
        }

        button {
            font-family: monospace;
            background: #0d1420;
            color: #d6e4f2;
            border: 1px solid #1c2a3d;
            padding: 8px 14px;
            margin: 4px;
            cursor: pointer;
        }

        button:hover {
            border-color: #4fa8ff;
            color: #9cd4ff;
        }

        .controls {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="number"],
        input[type="range"] {
            font-family: monospace;
            background: #0d1420;
            color: #d6e4f2;
            border: 1px solid #1c2a3d;
            padding: 4px;
        }

        input[type="number"] {
            width: 60px;
        }
    </style>
</head>

<body>

    <h1>Conway's Game of Life</h1>
    <canvas id="grid" width="600" height="600"></canvas>

    <div class="controls">
        <div class="control-row">
            <button id="stepBtn">Step</button>
            <button id="playBtn">Play</button>
            <button id="clearBtn">Clear</button>
            <button id="randomBtn">Random</button>
        </div>

        <div class="control-row">
            <label for="gridSizeInput">Grid size:</label>
            <input type="number" id="gridSizeInput" value="30" min="5" max="100">
            <button id="applySizeBtn">Apply</button>
        </div>

        <div class="control-row">
            <label for="speedSlider">Speed:</label>
            <input type="range" id="speedSlider" min="30" max="500" value="200">
            <span id="speedLabel">200 ms</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('grid');
        const ctx = canvas.getContext('2d');

        let numColumns = 30;
        let numRows = 30;
        let cellSize = canvas.width / numColumns;

        let grid = [];
        let ageGrid = [];

        function buildEmptyGrids() {
            grid = [];
            ageGrid = [];
            for (let row = 0; row < numRows; row++) {
                grid.push(new Array(numColumns).fill(0));
                ageGrid.push(new Array(numColumns).fill(0));
            }
        }

        buildEmptyGrids();

        function getCellColor(age) {
            if (age <= 1) return "#f2c14e";  // newborn — amber
            return "#4fa8ff";                // everything else — blue
        }

        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#1c2a3d";
            ctx.lineWidth = 1;
            for (let col = 0; col <= numColumns; col++) {
                ctx.beginPath();
                ctx.moveTo(col * cellSize, 0);
                ctx.lineTo(col * cellSize, canvas.height);
                ctx.stroke();
            }
            for (let row = 0; row <= numRows; row++) {
                ctx.beginPath();
                ctx.moveTo(0, row * cellSize);
                ctx.lineTo(canvas.width, row * cellSize);
                ctx.stroke();
            }

            for (let row = 0; row < numRows; row++) {
                for (let col = 0; col < numColumns; col++) {
                    if (grid[row][col] === 1) {
                        ctx.fillStyle = getCellColor(ageGrid[row][col]);
                        ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
                    }
                }
            }
        }

        drawGrid();

        canvas.addEventListener("click", function (event) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;

            const col = Math.floor(mouseX / cellSize);
            const row = Math.floor(mouseY / cellSize);

            if (grid[row][col] === 0) {
                grid[row][col] = 1;
                ageGrid[row][col] = 1;
            } else {
                grid[row][col] = 0;
                ageGrid[row][col] = 0;
            }

            drawGrid();
        });

        function nextGeneration() {
            let newGrid = [];
            let newAgeGrid = [];
            for (let row = 0; row < numRows; row++) {
                newGrid.push(new Array(numColumns).fill(0));
                newAgeGrid.push(new Array(numColumns).fill(0));
            }

            for (let row = 0; row < numRows; row++) {
                for (let col = 0; col < numColumns; col++) {
                    const liveNeighbors = countLiveNeighbors(row, col);
                    const isAlive = grid[row][col] === 1;

                    if (isAlive && (liveNeighbors === 2 || liveNeighbors === 3)) {
                        newGrid[row][col] = 1;
                        newAgeGrid[row][col] = ageGrid[row][col] + 1;
                    } else if (!isAlive && liveNeighbors === 3) {
                        newGrid[row][col] = 1;
                        newAgeGrid[row][col] = 1;
                    }
                }
            }

            grid = newGrid;
            ageGrid = newAgeGrid;
            drawGrid();
        }

        function countLiveNeighbors(row, col) {
            let count = 0;
            for (let rowOffset = -1; rowOffset <= 1; rowOffset++) {
                for (let colOffset = -1; colOffset <= 1; colOffset++) {
                    if (rowOffset === 0 && colOffset === 0) continue;

                    const neighborRow = row + rowOffset;
                    const neighborCol = col + colOffset;

                    if (neighborRow >= 0 && neighborRow < numRows && neighborCol >= 0 && neighborCol < numColumns) {
                        count += grid[neighborRow][neighborCol];
                    }
                }
            }
            return count;
        }

        const stepBtn = document.getElementById('stepBtn');
        const playBtn = document.getElementById('playBtn');
        const clearBtn = document.getElementById('clearBtn');
        const randomBtn = document.getElementById('randomBtn');
        const gridSizeInput = document.getElementById('gridSizeInput');
        const applySizeBtn = document.getElementById('applySizeBtn');
        const speedSlider = document.getElementById('speedSlider');
        const speedLabel = document.getElementById('speedLabel');

        stepBtn.addEventListener('click', function () {
            nextGeneration();
        });

        let isPlaying = false;
        let playInterval = null;

        function startAutoPlay() {
            clearInterval(playInterval);
            const delay = parseInt(speedSlider.value, 10);
            playInterval = setInterval(nextGeneration, delay);
        }

        playBtn.addEventListener('click', function () {
            isPlaying = !isPlaying;

            if (isPlaying) {
                playBtn.textContent = "Pause";
                startAutoPlay();
            } else {
                playBtn.textContent = "Play";
                clearInterval(playInterval);
            }
        });

        speedSlider.addEventListener('input', function () {
            speedLabel.textContent = speedSlider.value + " ms";
            if (isPlaying) startAutoPlay();
        });

        clearBtn.addEventListener('click', function () {
            isPlaying = false;
            playBtn.textContent = "Play";
            clearInterval(playInterval);
            buildEmptyGrids();
            drawGrid();
        });

        randomBtn.addEventListener('click', function () {
            for (let row = 0; row < numRows; row++) {
                for (let col = 0; col < numColumns; col++) {
                    if (Math.random() < 0.3) {
                        grid[row][col] = 1;
                        ageGrid[row][col] = 1;
                    } else {
                        grid[row][col] = 0;
                        ageGrid[row][col] = 0;
                    }
                }
            }
            drawGrid();
        });

        applySizeBtn.addEventListener('click', function () {
            isPlaying = false;
            playBtn.textContent = "Play";
            clearInterval(playInterval);

            const newSize = parseInt(gridSizeInput.value, 10);
            if (newSize < 5 || newSize > 100) return;

            numColumns = newSize;
            numRows = newSize;
            cellSize = canvas.width / numColumns;

            buildEmptyGrids();
            drawGrid();
        });
    </script>

</body>

</html>
